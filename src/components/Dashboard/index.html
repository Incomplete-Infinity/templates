<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futuristic Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <!-- Top Section -->
        <div class="top-section">
            <h2>Dashboard</h2>
            <div class="quick-info">
                <div class="info-card">👤 Profile</div>
                <div class="info-card">⚡ Quick Stats</div>
                <div class="info-card">🔔 Alerts</div>
            </div>
        </div>

        <!-- Center Sliding Section -->
        <div class="center-section">
            <div class="slider">
                <!-- Operations View -->
                <div class="slide operations">
                    <h2>Operations</h2>
                    <div class="operations-info">
                        <div class="info-card">🛰 Active Missions</div>
                        <div class="info-card">🚀 Fleet Management</div>
                        <div class="info-card">📊 Tactical Overview</div>
                    </div>
                </div>

                <!-- Details View -->
                <div class="slide details">
                    <h2>Details</h2>
                    <div class="details-info">
                        <div class="info-card">💰 Finances</div>
                        <div class="info-card">📉 Performance Analytics</div>
                        <div class="info-card">📌 Strategic Reports</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom Section -->
        <div class="bottom-section">
            <h2>Navigation</h2>
            <div class="nav-buttons">
                <button onclick="toggleSlide()">🔄 Switch View</button>
                <button>⚙ Settings</button>
                <button>🎨 Customization</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
